name: Generate MAVLink C Headers

# The one writing workflow in this repository: it keeps the pre-generated
# headers under generated/ in step with military.xml after a change lands
# on main. Everything PR-side lives in validate_dialect.yml and only reads.

on:
  push:
    branches: [main]
    paths:
      - "military.xml"
      - ".github/workflows/generate_c_lib.yml"
      - ".github/actions/setup-mavlink-tooling/**"
  workflow_dispatch:

permissions:
  contents: read

# One regeneration at a time and never cancelled mid-flight: a run killed
# between commit and push would just be rerun, but overlapping runs could
# race each other's rebase.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate committed C headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out this repository
        # Credentials stay in place on this checkout alone: the final
        # step pushes the regenerated headers back to main with the
        # job-scoped token.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MAVLink generation tooling
        uses: ./.github/actions/setup-mavlink-tooling

      - name: Generate C headers
        # Validation stays on: the pinned definitions and generator are a
        # pair proven against each other, so a validation failure here is
        # a real dialect defect, not upstream drift. The output tree is
        # cleared first so a message removed from the dialect cannot leave
        # a stale header behind.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf generated/include/mavlink/v2.0
          python3 -m pymavlink.tools.mavgen \
            --lang=C --wire-protocol=2.0 --strict-units \
            --output=generated/include/mavlink/v2.0 \
            mavlink/message_definitions/v1.0/military.xml

      - name: Commit and push regenerated headers
        run: |
          git config user.name  "auterion-ci"
          git config user.email "ci@auterion.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate MAVLink C headers [skip ci]"
            git pull --rebase
            git push
          fi
